    <script>
      (function() {
        try {
          var origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          if (origFetch) {
            var activeFetch = origFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return activeFetch;
              },
              set: function(newFetch) {
                if (typeof newFetch === 'function') {
                  activeFetch = newFetch;
                }
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (err) {
          // Ignore if already defined or restricted
        }
      })();
    </script>
